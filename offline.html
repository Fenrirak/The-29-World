<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<script>try { if (localStorage.getItem('t29-dark-mode') === '1') document.documentElement.classList.add('dark-mode'); } catch(e){}</script>
<title>You're offline — The 29 World</title>
<meta name="theme-color" content="#1f2b44">
<style>
  :root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--text:#1f2b44;--muted:#5b6477;--navy:#1f2b44;}
  html.dark-mode{--bg:#141b2d;--card:#1f2b44;--text:#eef1f8;--muted:#aab3c5;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .box{max-width:440px;width:100%;background:var(--card);border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 6px 24px rgba(31,43,68,.12);}
  h1{margin:0 0 8px;font-size:1.4rem;}
  p{margin:0 0 14px;line-height:1.5;color:var(--muted);}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:var(--navy);color:#fff;cursor:pointer;}
  html.dark-mode button{background:#f0b84a;color:#1f2b44;}
</style>
</head>
<body>
<main class="box">
  <h1>You're offline</h1>
  <p>The 29 World needs an internet connection to load your balance, class and activity. Check your Wi-Fi, then try again. Anything you had already finished before the connection dropped should be saved. Check it once you are back online.</p>
  <button type="button" onclick="location.href='index.html'">Try again</button>
</main>
<script>window.addEventListener("online", function(){ location.href = "index.html"; });</script>
</body>
</html>
